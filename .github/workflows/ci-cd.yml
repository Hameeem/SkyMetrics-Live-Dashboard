name: SkyMetrics CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Train Initial Model Artifact
      run: |
        python ml/train.py

    - name: Run Pytest Test Suite
      run: |
        pytest tests/ -v --cov=backend --cov=ml --cov=scripts

  docker:
    name: Build Docker Verification
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Backend Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.backend
        push: false
        tags: skymetrics-backend:latest

    - name: Build Dashboard Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.dashboard
        push: false
        tags: skymetrics-dashboard:latest
